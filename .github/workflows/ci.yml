name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest # Linux x86_64 is a supported Kotlin/Native host

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: password
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      # Backs the native (libmariadb) MySQL tests. MariaDB uses mysql_native_password, so the
      # native client connects over plaintext without the caching_sha2 public-key dance.
      mysql:
        image: mariadb:11
        env:
          MARIADB_ROOT_PASSWORD: password
          MARIADB_DATABASE: kormium_test
          MARIADB_USER: kormium
          MARIADB_PASSWORD: kormium
        ports:
          - 3306:3306
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install libpq + libsqlite3 + libmariadb (for the Kotlin/Native cinterops)
        run: sudo apt-get update && sudo apt-get install -y libpq-dev libsqlite3-dev libmariadb-dev

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # JVM unit tests. kormium-sqlite runs against an in-memory database (no Docker); it covers
      # both the blocking and the suspend (offload) paths.
      - name: JVM tests
        run: ./gradlew :kormium-core:jvmTest :kormium-decimal:jvmTest :kormium-sqlite:jvmTest :kormium-migrate:jvmTest --console=plain

      # Native (libpq) tests against the Postgres service above. The host native test task
      # on a Linux runner is linuxX64Test (the modules now declare real native targets).
      # kormium-sqlite's native tests use an in-memory database (no Postgres needed).
      - name: Native tests
        env:
          KORMIUM_DB_HOST: localhost
          KORMIUM_DB_PORT: "5432"
          KORMIUM_DB_NAME: postgres
          KORMIUM_DB_USER: postgres
          KORMIUM_DB_PASSWORD: password
          # kormium-mysql's native tests read MYSQL_* and run against the MariaDB service above.
          MYSQL_HOST: 127.0.0.1
          MYSQL_PORT: "3306"
          MYSQL_DB: kormium_test
          MYSQL_USER: kormium
          MYSQL_PASSWORD: kormium
        run: ./gradlew :kormium-core:linuxX64Test :kormium-decimal:linuxX64Test :kormium-postgres:linuxX64Test :kormium-sqlite:linuxX64Test :kormium-migrate:linuxX64Test :kormium-mysql:linuxX64Test --console=plain

      # The ktor integration libraries are libraries (no native exe link), so assemble
      # builds their JVM + native artifacts to verify they compile on every target.
      - name: Build ktor integration modules
        run: ./gradlew :kormium-ktor:assemble :kormium-ktor-di:assemble :kormium-ktor-koin:assemble --console=plain

      # Cross-compile the experimental Windows (mingwX64) klibs. There is no Windows
      # runner yet, so nothing executes — this only keeps the target compiling. The libpq
      # cinterop resolves platform-neutral headers from libpq-dev installed above.
      - name: Cross-compile Windows (mingwX64) klibs
        run: ./gradlew :kormium-core:compileKotlinMingwX64 :kormium-postgres:compileTestKotlinMingwX64 :kormium-sqlite:linkDebugTestMingwX64 :kormium-observe:compileKotlinMingwX64 :kormium-migrate:compileKotlinMingwX64 :kormium-ktor:compileKotlinMingwX64 :kormium-ktor-di:compileKotlinMingwX64 :kormium-ktor-koin:compileKotlinMingwX64 --console=plain

      # Self-contained SQLite samples — tests run on both JVM and native (no Docker needed).
      # The samples still use a single host-named native target, so their task is `nativeTest`.
      - name: SQLite sample tests (JVM + native)
        run: >-
          ./gradlew
          :samples:crud-sqlite:jvmTest :samples:crud-sqlite:nativeTest
          :samples:repository:jvmTest :samples:repository:nativeTest
          :samples:sharding:jvmTest :samples:sharding:nativeTest
          --console=plain

      # Async r2dbc backend (JVM-only) — end-to-end tests spin up their own Postgres via
      # Testcontainers.
      - name: r2dbc tests (Testcontainers, JVM)
        run: ./gradlew :kormium-r2dbc:jvmTest --console=plain

      # MySQL JVM (JDBC) end-to-end tests spin up their own MySQL via Testcontainers.
      - name: MySQL JVM tests (Testcontainers, JVM)
        run: ./gradlew :kormium-mysql:jvmTest --console=plain

      # Postgres samples — JVM end-to-end tests spin up their own Postgres via Testcontainers.
      # samples:r2dbc is the async variant of ktor-di.
      - name: Postgres sample tests (Testcontainers, JVM)
        run: >-
          ./gradlew
          :samples:ktor-di:jvmTest :samples:ktor-koin:jvmTest :samples:sqlite-cache:jvmTest
          :samples:r2dbc:jvmTest
          --console=plain

      # Wasm/Node database engines, run under the Kotlin-managed Node: kormium-sqlite-wasm
      # (wa-sqlite) and kormium-sqlite-node (better-sqlite3) use in-memory databases (no server);
      # kormium-postgres-node and kormium-mysql-node connect to the Postgres/MariaDB services above
      # via KORMIUM_PG_*/KORMIUM_MY_* (they skip if unset).
      - name: Wasm/Node engine tests
        env:
          KORMIUM_PG_HOST: localhost
          KORMIUM_PG_PORT: "5432"
          KORMIUM_PG_DB: postgres
          KORMIUM_PG_USER: postgres
          KORMIUM_PG_PASSWORD: password
          KORMIUM_MY_HOST: 127.0.0.1
          KORMIUM_MY_PORT: "3306"
          KORMIUM_MY_DB: kormium_test
          KORMIUM_MY_USER: kormium
          KORMIUM_MY_PASSWORD: kormium
        run: >-
          ./gradlew
          :kormium-sqlite-wasm:wasmJsNodeTest
          :kormium-sqlite-node:wasmJsNodeTest
          :kormium-postgres-node:wasmJsNodeTest
          :kormium-mysql-node:wasmJsNodeTest
          --console=plain

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: "**/build/reports/tests/**"
          if-no-files-found: ignore

  # Real test execution on Windows for the experimental mingwX64 target: JVM tests plus
  # native (mingwX64) tests. The PostgreSQL server preinstalled on the runner image backs
  # the libpq tests (Linux service containers don't work on Windows runners), and MSYS2
  # (also preinstalled) provides the mingw libpq the test executables link against — the
  # same route benchmarks/run.bat documents for users.
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # The Windows K/N toolchain + deps are a multi-hundred-MB download; cache them.
      - name: Cache Kotlin/Native toolchain
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-windows-kotlin-2.4.0

      - name: Install mingw libpq (MSYS2)
        run: C:\msys64\usr\bin\pacman.exe -Sy --noconfirm mingw-w64-x86_64-postgresql

      - name: Start the preinstalled PostgreSQL service
        shell: pwsh
        run: |
          $svc = Get-Service postgresql*
          Set-Service -InputObject $svc -StartupType Manual
          Start-Service -InputObject $svc
          & "$env:PGBIN\pg_isready.exe" -h localhost -t 30
          if ($LASTEXITCODE -ne 0) { throw "PostgreSQL is not accepting connections" }

      - name: JVM tests
        run: .\gradlew.bat :kormium-core:jvmTest :kormium-sqlite:jvmTest :kormium-migrate:jvmTest --console=plain

      # The runner image's PostgreSQL uses postgres/root credentials (PGUSER/PGPASSWORD).
      # libpq.dll and its mingw runtime live in C:\msys64\mingw64\bin, so the test
      # executables need it on PATH.
      - name: Native (mingwX64) tests
        shell: pwsh
        env:
          KORMIUM_DB_HOST: localhost
          KORMIUM_DB_PORT: "5432"
          KORMIUM_DB_NAME: postgres
          KORMIUM_DB_USER: postgres
          KORMIUM_DB_PASSWORD: root
        run: |
          $env:PATH = "C:\msys64\mingw64\bin;$env:PATH"
          .\gradlew.bat :kormium-core:mingwX64Test :kormium-postgres:mingwX64Test :kormium-sqlite:mingwX64Test :kormium-migrate:mingwX64Test --console=plain

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-windows
          path: "**/build/reports/tests/**"
          if-no-files-found: ignore

  # Compose Multiplatform targets (androidTarget + iosX64/iosArm64/iosSimulatorArm64).
  # iOS klibs only compile on a macOS host; the macos-latest runner also ships the Android
  # SDK, so it covers both. The unqualified task names run in every module that declares
  # them — i.e. kormium-core, kormium-sqlite and the three kormium-ktor* modules.
  mobile:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Compile the Android and iOS variants of every Compose-Multiplatform-enabled module.
      # sqlite3.h is vendored and iOS/macOS ship libsqlite3, so no extra system deps are needed.
      - name: Build Android + iOS targets
        run: >-
          ./gradlew
          compileAndroidMain
          compileKotlinIosArm64 compileKotlinIosX64 compileKotlinIosSimulatorArm64
          --console=plain

# Publishing to Maven Central lives in its own manual-dispatch workflow (.github/workflows/publish.yml)
# so a release is a deliberate, maintainer-triggered action rather than a side effect of CI.
