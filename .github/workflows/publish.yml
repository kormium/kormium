name: Publish

# Manual-only release. Publishing to Maven Central is irreversible, so it never fires
# automatically (no tag/push trigger) — a maintainer dispatches it explicitly, choosing
# the ref (a release tag like v0.2.0, or main) to build and publish from.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to publish from (release tag, e.g. v0.2.0, or a branch)."
        required: true
        default: main

# Publish all artifacts (JVM + linuxX64/macosX64/macosArm64 + the BOM) to Maven Central
# Portal from a single macOS host, so the deployment is one complete, atomic bundle.
# macOS K/N can cross-compile the Linux klibs; brew libpq supplies the headers the libpq
# cinterop needs for every target (sqlite3.h is vendored in the repo).
jobs:
  publish:
    runs-on: macos-latest
    permissions:
      contents: write # create/update the GitHub Release for the published tag
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install libpq + mariadb-connector-c (for the Kotlin/Native cinterops)
        run: brew install libpq mariadb-connector-c

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Publish to Maven Central Portal
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_IN_MEMORY_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_IN_MEMORY_KEY_PASSWORD }}
        run: ./gradlew publishToMavenCentral --no-configuration-cache --console=plain

      # When publishing from a version tag (vX.Y.Z), publish a matching GitHub Release whose
      # notes are the changelog section for that version. Idempotent: updates the release if it
      # already exists. Skipped when dispatched from a branch (e.g. main).
      - name: Create GitHub Release from CHANGELOG
        if: startsWith(inputs.ref, 'v')
        env:
          GH_TOKEN: ${{ github.token }}
          REF: ${{ inputs.ref }}
        run: |
          version="${REF#v}"
          # Pull the lines between this version's heading and the next "## [" heading.
          notes=$(awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { f=1; next }
            /^## \[/ && f { exit }
            f { print }
          ' CHANGELOG.md)
          # Title: turn "## [0.2.0] — API redesign" into "v0.2.0 — API redesign".
          title=$(grep -m1 "^## \[$version\]" CHANGELOG.md | sed -E "s/^## \[$version\]/v$version/")
          [ -n "$title" ] || title="$REF"
          if [ -z "$notes" ]; then
            echo "No CHANGELOG section for $version — using auto-generated notes."
            notes_args=(--generate-notes)
          else
            printf '%s\n' "$notes" > /tmp/release-notes.md
            notes_args=(--notes-file /tmp/release-notes.md)
          fi
          # A version with a hyphen is a prerelease (v0.15.0-beta01, v1.0.0-rc1): mark it as such
          # so it is not offered as the release people are meant to take. A stable version passes
          # nothing, leaving GitHub's own "latest" handling exactly as it was.
          prerelease_args=()
          case "$version" in
            *-*) prerelease_args=(--prerelease) ;;
          esac
          if gh release view "$REF" >/dev/null 2>&1; then
            gh release edit "$REF" --title "$title" "${notes_args[@]}" "${prerelease_args[@]}"
          else
            gh release create "$REF" --title "$title" --verify-tag "${notes_args[@]}" "${prerelease_args[@]}"
          fi
