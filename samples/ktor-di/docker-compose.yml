# Postgres for the ktor-di sample. Start it before running the app:
#   docker compose -f samples/ktor-di/docker-compose.yml up -d
# These settings match the ones hardcoded in the sample
# (localhost:5432, user/db "postgres", password "password").
services:
  postgres:
    image: postgres:18-alpine
    container_name: kormium-ktor-di-postgres
    environment:
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 3s
      retries: 20
